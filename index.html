    <style>
      html, body, #root {

      /* Keyboard focus ring — visible only on keyboard nav, suppressed
         for mouse clicks. Crucial for accessibility on a dark site. */
      :focus { outline: none; }
      :focus-visible {
        outline: 2px solid rgba(235, 179, 6, 0.85);
        outline-offset: 2px;
        border-radius: 4px;
      }
      button:focus-visible, a:focus-visible {
        outline-offset: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
